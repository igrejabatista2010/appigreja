<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;">Redefinir senha</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">
            Use o código abaixo no app para criar uma nova senha:
          </p>
          <p style="margin:0 0 24px;font-size:32px;font-weight:bold;letter-spacing:8px;text-align:center;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#71717a;">
            O código expira em 1 hora. Se você não pediu para redefinir a senha, ignore este e-mail. Sua senha atual continua valendo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
